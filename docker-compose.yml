services:
  db:
    image: postgres:16-alpine
    container_name: langex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langex
      POSTGRES_PASSWORD: langex_dev_password
      POSTGRES_DB: langex
    ports:
      - "5432:5432"
    volumes:
      - langex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langex-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://langex:langex_dev_password@db:5432/langex
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      NODE_ENV: development
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: langex-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  langex_postgres_data:
    name: langex_postgres_data
